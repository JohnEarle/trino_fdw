coordinator=true
node-scheduler.include-coordinator=true
# Plain HTTP stays on (not published) for node discovery; clients must use HTTPS
# because password authentication is refused over HTTP.
discovery.uri=http://localhost:8080
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/server.pem
http-server.authentication.type=CERTIFICATE,JWT,PASSWORD
http-server.https.truststore.path=/etc/trino/tls/ca.pem
http-server.authentication.certificate.user-mapping.pattern=CN=([^,]+).*
http-server.authentication.jwt.key-file=/etc/trino/jwt/public.pem
http-server.authentication.jwt.required-audience=trino
internal-communication.shared-secret=dev-only-shared-secret-change-me
