apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trino-bridge
spec:
  instances: 2
  imageName: registry.example/cnpg-trino-fdw:17   # built from image/Dockerfile
  primaryUpdateStrategy: unsupervised

  resources:
    requests: { cpu: "500m", memory: 1Gi }
    limits:   { cpu: "2",    memory: 2Gi }

  postgresql:
    parameters:
      max_connections: "50"
      log_statement: "none"          # nothing secret is ever in SQL, but keep logs quiet

  storage:
    size: 5Gi

  # Secrets reach the wrapper as files, never as SQL options.
  projectedVolumeTemplate:
    defaultMode: 0400
    sources:
      - secret:
          name: trino-fdw-creds
          items:
            - key: password
              path: trino/password
            - key: ca.pem
              path: trino/ca.pem
      # Optional zero-secret alternative for auth 'jwt':
      # - serviceAccountToken:
      #     audience: trino
      #     expirationSeconds: 3600
      #     path: trino/token

  bootstrap:
    initdb:
      database: bridge
      owner: bridge_owner
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: trino-fdw-bootstrap
            key: setup.sql

  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: trino-bridge-external
              annotations: {}   # cloud LB annotations, if any
            spec:
              type: LoadBalancer
