apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-fdw-bootstrap
data:
  setup.sql: |
    CREATE EXTENSION IF NOT EXISTS multicorn;

    -- catalog guard: refuse secret-bearing options (see sql/20_guard.sql)
    CREATE OR REPLACE FUNCTION trino_fdw_guard() RETURNS event_trigger
    LANGUAGE plpgsql AS $$
    DECLARE
        forbidden text[] := ARRAY['password','passwd','pwd','pass','token','jwt','bearer','secret',
                                  'client_secret','api_key','apikey','private_key','key','keytab'];
        offender text;
    BEGIN
        SELECT string_agg(DISTINCT what, ', ') INTO offender FROM (
            SELECT 'server ' || s.srvname AS what FROM pg_foreign_server s
            JOIN pg_foreign_data_wrapper w ON w.oid = s.srvfdw AND w.fdwname = 'multicorn'
            WHERE EXISTS (SELECT 1 FROM unnest(s.srvoptions) o WHERE split_part(o,'=',1)='wrapper' AND split_part(o,'=',2) LIKE 'trino_fdw.%')
              AND EXISTS (SELECT 1 FROM unnest(s.srvoptions) o WHERE lower(split_part(o,'=',1)) = ANY (forbidden))
            UNION ALL
            SELECT 'user mapping on server ' || s.srvname FROM pg_user_mapping um
            JOIN pg_foreign_server s ON s.oid = um.umserver
            JOIN pg_foreign_data_wrapper w ON w.oid = s.srvfdw AND w.fdwname = 'multicorn'
            WHERE EXISTS (SELECT 1 FROM unnest(s.srvoptions) o WHERE split_part(o,'=',1)='wrapper' AND split_part(o,'=',2) LIKE 'trino_fdw.%')
              AND EXISTS (SELECT 1 FROM unnest(um.umoptions) o WHERE lower(split_part(o,'=',1)) = ANY (forbidden))
            UNION ALL
            SELECT 'foreign table ' || ft.ftrelid::regclass::text FROM pg_foreign_table ft
            JOIN pg_foreign_server s ON s.oid = ft.ftserver
            JOIN pg_foreign_data_wrapper w ON w.oid = s.srvfdw AND w.fdwname = 'multicorn'
            WHERE EXISTS (SELECT 1 FROM unnest(s.srvoptions) o WHERE split_part(o,'=',1)='wrapper' AND split_part(o,'=',2) LIKE 'trino_fdw.%')
              AND EXISTS (SELECT 1 FROM unnest(ft.ftoptions) o WHERE lower(split_part(o,'=',1)) = ANY (forbidden))
        ) x;
        IF offender IS NOT NULL THEN
            RAISE EXCEPTION 'trino_fdw: secret-bearing option refused on %', offender
                USING HINT = 'Store the secret in a file and reference it with password_file, jwt_file or key_file.';
        END IF;
    END; $$;
    DROP EVENT TRIGGER IF EXISTS trino_fdw_guard;
    CREATE EVENT TRIGGER trino_fdw_guard ON ddl_command_end
        WHEN TAG IN ('CREATE SERVER','ALTER SERVER','CREATE USER MAPPING','ALTER USER MAPPING',
                     'CREATE FOREIGN TABLE','ALTER FOREIGN TABLE','IMPORT FOREIGN SCHEMA')
        EXECUTE FUNCTION trino_fdw_guard();

    CREATE SERVER trino FOREIGN DATA WRAPPER multicorn OPTIONS (
        wrapper 'trino_fdw.TrinoFDW',
        host 'trino.example.internal', port '8443',
        catalog 'hive', schema 'prod',
        auth 'password', user 'svc_fdw',
        password_file '/projected/trino/password',
        ca_file '/projected/trino/ca.pem',
        strict_file_permissions 'true'
    );

    -- The application role. Set its password afterwards with a managed role or ALTER ROLE.
    CREATE ROLE reader LOGIN;
    CREATE USER MAPPING FOR reader SERVER trino OPTIONS (trino_user 'reader');
    GRANT USAGE ON FOREIGN SERVER trino TO reader;
